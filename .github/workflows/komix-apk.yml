# KomiX-specific APK workflow replacing inherited release automation.
name: Build KomiX APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK was generated
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::The debug build completed without generating an APK in app/build/outputs/apk/debug."
            exit 1
          fi
          echo "Found debug APK: $apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KomiX-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
